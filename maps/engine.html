    const o = toM(ll, ll0), len = Math.hypot(o[0], o[1]) || 1, side = (i % 2 ? 1 : -1) * (e.spread ?? 10) * MPP;
    const at = fromM([-o[1] / len * side, o[0] / len * side], ll);
    const [x, y] = P(at), [x0, y0] = P(ll0), k = perspective(at);
    units.push({ x, y, k, ang: Math.atan2(y - P(fromM([-o[1] / len * side, o[0] / len * side], ll0))[1], x - P(fromM([-o[1] / len * side, o[0] / len * side], ll0))[0]), i });
  }
  units.sort((a, b) => a.y - b.y);                                  // far (higher on screen) first
  fx.save(); fx.globalAlpha = out;
  for (const u of units) {
    if (e.unit === 'tank') tank(u.x, u.y, (e.size || 34) * u.k, u.ang, e.color || '#b8433a');
    else soldier(u.x, u.y, (e.size || 34) * u.k, t * 9 + u.i * 1.7, e.color || '#b8433a', Math.cos(u.ang) >= 0 ? 1 : -1);
  }
  fx.restore();
}

function battery(e, t) {
  // guns around a point firing glowing shells along arcs to a target area; impacts burst on landing
  const out = e.until ? clamp(1 - (t - e.until) / 0.6) : 1; if (t < e.t || out <= 0) return;
  const [bx, by] = P(e.at), [tx, ty] = P(e.target), n = e.n || 3, every = e.every || 1.1, fly = e.fly || 0.9;
  const dir = tx >= bx ? 1 : -1, pop = ease((t - e.t) / 0.4), kb = perspective(e.at), kt = perspective(e.target);
  const spreadM = (e.spread || 90) * MPP;
  fx.save(); fx.globalAlpha = out;
  for (let g = 0; g < n; g++) {
    const [gx, gy] = P(fromM([(g - (n - 1) / 2) * 46 * MPP, -(g % 2) * 18 * MPP], e.at));
    let flash = 0;
    for (let k = 0; k < 40; k++) {
      const fire = e.t + 0.4 + k * every + g * every / n; if (fire > t) break;
      const age = t - fire; flash = Math.max(flash, clamp(1 - age / 0.18));
      const [ix, iy] = P(fromM([(rnd(g * 97 + k) - 0.5) * spreadM, (rnd(g * 31 + k * 7) - 0.5) * spreadM], e.target));
      if (age < fly) {                                             // shell in flight: tracer with a fading tail
        for (let j = 0; j < 6; j++) { const u = clamp(age / fly - j * 0.025); if (u <= 0) break;
          const x = lerp(gx, ix, u), y = lerp(gy, iy, u) - Math.sin(u * Math.PI) * (e.arc || 160);
          fx.fillStyle = `rgba(255,${200 - j * 20},${120 - j * 15},${1 - j / 6})`; fx.shadowColor = '#ffb050'; fx.shadowBlur = 14;
          fx.beginPath(); fx.arc(x, y, 8 - j, 0, 7); fx.fill(); }
      } else explosion(ix, iy, age - fly, (e.boom || 26) * kt);
    }
    fx.globalAlpha = out * pop; gun(gx, gy, (e.size || 40) * kb * (0.8 + 0.2 * pop), dir, e.color || '#9a463b', flash); fx.globalAlpha = out;
  }
  fx.restore();
}

function impacts(e, t) {
  const out = e.until ? clamp(1 - (t - e.until) / 0.6) : 1; if (t < e.t || out <= 0) return;
  fx.save(); fx.globalAlpha = out; const sM = (e.spread || 160) * MPP;
  for (let k = 0; k < 60; k++) { const when = e.t + k * (e.every || 0.35) + rnd(k) * 0.2; if (when > t) break;
    const ll = fromM([(rnd(k * 13) - 0.5) * sM, (rnd(k * 29) - 0.5) * sM], e.at), [x, y] = P(ll);
    explosion(x, y, t - when, (e.size || 22) * perspective(ll)); }
  fx.restore();
}

const DRAW = { zone, arrow, route, label, pulse, column, battery, impacts };

window.renderAt = async (t) => {
  const c = camAt(t);
  map.jumpTo({ center: c.center, zoom: c.zoom, pitch: c.pitch, bearing: c.bearing });
  MPP = 40075016.686 * Math.cos(c.center[1] * RAD) / (512 * Math.pow(2, c.zoom));
  for (const k in FEAT) FEAT[k] = [];
  const GEO = new Set(['zone', 'arrow', 'route']);
  for (const e of scene.layers) if (GEO.has(e.kind)) DRAW[e.kind](e, t);          // 3D layers -> GeoJSON
  for (const k in FEAT) map.getSource(k).setData({ type: 'FeatureCollection', features: FEAT[k] });
  await new Promise(r => { if (map.loaded() && map.areTilesLoaded()) { map.once('render', r); map.triggerRepaint(); } else map.once('idle', r); setTimeout(r, 15000); });
  await new Promise(r => { if (map.areTilesLoaded()) { map.once('render', r); map.triggerRepaint(); } else map.once('idle', r); setTimeout(r, 15000); });
  fx.clearRect(0, 0, 1920, 1080);
  for (const e of scene.layers) if (!GEO.has(e.kind)) DRAW[e.kind]?.(e, t);    // labels, units, fire on the 2D canvas
  return true;
};
